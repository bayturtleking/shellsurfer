<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shell Surfer Extensions Store</title>

    <style>
        html {
            font-family: Arial, sans-serif;
            background: #2c2c2c;
            color: white;
            text-align: center;
        }

        .extension-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .extension {
            background: linear-gradient(#3a3a3a, #3193c0);
            background-size: 100% 2000%;
            background-position-y: 0%;
            border-radius: 20px;
            padding: 15px;
            text-align: left;
            display: flex;
            border: 3px solid rgb(97, 97, 97);
            flex-direction: column;
            gap: 10px;
            transition: border 150ms;
            transition: background-position-y 500ms;
        }

        .extension:hover {
            border: 3px solid rgb(7, 226, 255);
            background-size: 100% 300%;
            background-position-y: 10% !important;
        }

        .extension:hover button {
            background: rgba(150, 150, 150, 0.3);
            transition: all 150ms;
        }

        .extension:hover button:hover {
            background: rgba(150, 150, 150, 0.6);
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #444;
            color: white;
        }

        button:hover {
            background: #666;
        }

        .verified {
            color: #00ccff;
            font-size: 0.8rem;
        }

        .flagged {
            color: red;
            font-size: 0.8rem;
        }

        .topbar {
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="topbar">
        <h1 style="margin-bottom: 0;">Shell Surfer</h1>
        <h2 style="margin-top: 0;">Official Extension Store</h2>
        <h3 id="notonssurf"  style="color:red; display: none;">You may not be on Shell Surfer. Extensions will not work unless you're using Shell Surfer!</h3>
        <p>This is the only place to get official extensions! Don't install from untrusted sites.</p>

        <button onclick="gotomanager()">Manage Extensions</button>
        <button onclick="filterverified()">Official Only</button>
        <button onclick="loadextensions()">Reset</button>
    </div>

    <div class="extension-grid" id="grid"></div>

    <script>
        let extensions = [];

        async function loadextensions() {
            try {
                const res = await fetch('https://raw.githubusercontent.com/bayturtleking/shellsurfer/main/extensions.json');
                if (!res.ok) throw new Error();
                extensions = await res.json();
            } catch (err) {
                const res = await fetch('https://cdn.jsdelivr.net/gh/bayturtleking/shellsurfer@refs/heads/main/extensions.json');
                extensions = await res.json();
            }
            showww(extensions);
        }

        function showww(list) {
            const grid = document.getElementById("grid");
            grid.innerHTML = "";

            list.forEach(ext => {
                const div = document.createElement("div");
                div.className = "extension";

                let taghtml = "";
                if (ext.tag === "Store: Verified") {
                    taghtml = '<p class="verified">Official</p>';
                } else if (ext.tag === "Store: Flagged") {
                    taghtml = '<p class="flagged">Flagged</p>';
                }
                const title = document.createElement("h2");
                title.textContent = ext.title;
                const descc = document.createElement("p");
                descc.textContent = ext.description;
                const version = document.createElement("small");
                version.textContent = "v" + (ext.version || "1.0.0");
                const tagg = document.createElement("div");
                tagg.innerHTML = taghtml;
                const btnn = document.createElement("button");
                btnn.textContent = "Install";
                btnn.addEventListener("click", () => {
                    installextension(ext);
                });
                div.appendChild(title);
                div.appendChild(descc);
                div.appendChild(version);
                div.appendChild(tagg);
                div.appendChild(btnn);
                grid.appendChild(div);
            });
        }

        function installextension(ext) {
            if (ext.tag === null) { ext.tag = "Store"; }
            window.location.href =
                "/loadurl?load=extension.install." +
                encodeURIComponent(JSON.stringify(ext));
            alert("Installed! Restart Shell Surfer");
        }

        function filterverified() {
            showww(extensions.filter(e => e.tag === "Store: Verified"));
        }
        function isevenonssurf() {
            return /ShellSurfer\//.test(navigator.userAgent);
        }
        function ssurfver_hasnew_ext_features(min = "1.10.4") {
            const mnnfa = navigator.userAgent.match(/ShellSurfer\/(\d+(?:\.\d+)*)/);
            if (!mnnfa) return false;
            const havee = mnnfa[1].split(".").map(Number);
            const needd = min.split(".").map(Number);
            for (let i = 0; i < Math.max(havee.length, needd.length); i++) {
                const aeaea = havee[i] || 0;
                const bbaeab = needd[i] || 0;
                if (aeaea > bbaeab) return true;
                if (aeaea < bbaeab) return false;
            }
            return true;
        }
        if (isevenonssurf()) {
            if (!ssurfver_hasnew_ext_features("1.10.4")) {
                document.getElementById("notonssurf").textContent = "Your version of Shell Surfer does not include the newest extension API changes. Some extensions may not work. Consider updating!!"
               document.getElementById("notonssurf").style.display = "block";
            }
        } else {
            document.getElementById("notonssurf").style.display = "block";
        }

        function gotomanager() {
            window.location.href = "ssurf://extensions";
        }

        loadextensions();
    </script>

</body>

</html>
